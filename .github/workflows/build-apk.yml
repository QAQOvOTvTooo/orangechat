name: Build OrangeChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - liquid-glass-ui
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull material-color-utilities submodule
        run: |
          rm -rf material3/material-color-utilities
          git clone https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          cd material3/material-color-utilities
          git checkout 6fd88eb3e95ba1d457842e2a2bf847d06b3a018a || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js & pnpm (for web-ui)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          if [ -d "web-ui" ] && [ -f "web-ui/package.json" ]; then
            cd web-ui && pnpm install
          fi

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Generate and Persist Debug Keystore if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "app/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/debug.keystore
            git commit -m "chore(build): 持久化固定 app/debug.keystore 签名以支持覆盖安装"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrangeChat-LiquidGlass-APK
          path: app/build/outputs/apk/debug/*.apk
